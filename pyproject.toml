[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbp4ai-dispatcher"
version = "0.5.8"
description = "SBP (Session Bridge Protocol) relay. Two modes: legacy HMAC/plaintext for trusted LAN, and an E2EE mode where the relay holds only public keys and routes by opaque HMAC tags - it can never read prompt text or history."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "slamKun" }]
keywords = ["sbp", "relay", "e2ee", "session-bridge", "websocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "aiohttp>=3.9",
    "sbp4ai-client>=0.5.7",
]

[project.scripts]
sbp-dispatcher = "sbp_dispatcher:main"
sbp4ai-dispatcher = "sbp_dispatcher:main"

[project.urls]
Homepage = "https://github.com/sbp4ai/sbp-dispatcher"
Specification = "https://github.com/sbp4ai/sbp-spec/blob/main/spec/SBP-0.4-e2ee.md"

[tool.setuptools]
packages = ["sbp_dispatcher"]
